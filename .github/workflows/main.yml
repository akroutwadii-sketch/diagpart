name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Locate project and patch pubspec
        run: |
          TARGET_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1 | xargs dirname)
          cd "$TARGET_DIR"
          sed -i '/open_file/d' pubspec.yaml || true
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  path: 1.8.3" >> pubspec.yaml

      - name: Fetch dependencies
        run: |
          TARGET_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1 | xargs dirname)
          cd "$TARGET_DIR"
          flutter pub get || true

      - name: Build Release APK
        run: |
          TARGET_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1 | xargs dirname)
          cd "$TARGET_DIR"
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
