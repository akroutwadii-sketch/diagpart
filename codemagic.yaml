workflows:
  android-apk:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - keystore_reference
      java: 17
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
